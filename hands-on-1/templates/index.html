<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hands-on 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            /* Nunito Sans is easier on the eyes; system fonts act as fallback */
            font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* blue ocean: deep sea gradient with light rays at the surface */
            background:
                radial-gradient(circle at 20% 0%, rgba(120, 220, 255, 0.45), transparent 55%),
                radial-gradient(circle at 85% 15%, rgba(0, 180, 216, 0.35), transparent 50%),
                linear-gradient(180deg, #0077b6 0%, #023e8a 45%, #03045e 100%);
            background-attachment: fixed;
            padding: 2rem;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 3rem 4rem;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(2, 20, 60, 0.45);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #e0f7ff;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(120, 220, 255, 0.45);
        }
        p  {
            color: #dff6fb;
            font-size: 1.2rem;
            font-weight: 400;
            line-height: 1.75;
            letter-spacing: 0.01em;
        }
        .student-id {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(202, 240, 248, 0.3);
            color: #90e0ef;
            font-weight: bold;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>hands-on 1</h1>
        <p>Hello, this is a web app deployed at a local server!</p>
        <p class="student-id">Student ID: 326020081</p>
    </div>
</body>
</html>
