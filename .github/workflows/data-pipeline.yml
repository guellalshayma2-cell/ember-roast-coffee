# Data pipeline: runs clean_and_merge.py whenever a file in data/ changes,
# regenerating the SQLite database (orders.db) and committing it back.

name: Data Pipeline (clean & merge)

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "clean_and_merge.py"
      - ".github/workflows/data-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    name: Run clean_and_merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas flask

      - name: Run clean_and_merge script
        run: python clean_and_merge.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orders.db
          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "chore: update orders.db from data pipeline [skip ci]"
            git push
          fi
