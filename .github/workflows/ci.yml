# =========================================================
# CI Workflow — Ember & Roast Coffee Shop
# Runs on every push and pull request to main.
# Validates HTML and checks JavaScript syntax.
# =========================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate HTML & JS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Lint HTML
        run: npx --yes htmlhint index.html

      - name: Verify required files exist
        run: |
          for f in index.html app.js style.css; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          echo "All required files present."
